name: Build RTMW3D and RTMW L-X ONNX matrix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onnx.yml'
      - 'scripts/**'
      - 'experiments/rtmw2d.py'
      - 'patches/**'
      - 'tests/test_*.py'
      - 'tests/runtime-patch.test.mjs'
      - 'models.json'
      - 'requirements-build.txt'
      - 'package.json'
      - 'MODEL_CARD.md'
      - 'UPSTREAM_LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      rtmw2d-export:
    name: GitHub source - ${{ matrix.model }} 256x192
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        model: [rtmw-l, rtmw-x]
    steps:
      - uses: actions/github-script@v7
        id: source
        env:
          MODEL: ${{ matrix.model }}
        with:
          script: |
            const name = process.env.MODEL + '-256x192-base';
            if (process.env.MODEL === 'rtmw-l') {
              core.setOutput('run', '41359976048');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const hit = artifacts.find(a => a.name === name && !a.expired && a.workflow_run?.id !== context.runId);
            if (!hit) throw new Error(name + ': GitHub weight artifact not found. Official-host download fallback is disabled. Supply the GitHub base artifact before rebuilding X.');
            core.setOutput('run', String(hit.workflow_run.id));
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: DaisukeDaisuke/mmpose-actions
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ matrix.model }}-256x192-base
          path: base
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-256x192-base
          path: base/
          retention-days: 7
  rtmw2d-quantize:
    name: ${{ matrix.model }} / ${{ matrix.policy }}
    needs: rtmw2d-export
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        model: [rtmw-l, rtmw-x]
        policy: [fp32, fp16-all, fp16-backbone, fp16-neck-head, int8-all, int8-backbone, int8-neck, int8-head]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 onnxconverter-common==1.14.0 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model }}-256x192-base
          path: base
      - run: python experiments/rtmw2d.py quantize --model '${{ matrix.model }}' --policy '${{ matrix.policy }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rtmw2d-${{ matrix.model }}-${{ matrix.policy }}-build
          path: release/
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Append RTMW 2D to existing Hugging Face repository
    needs: [catalog, rtmw2d-quantize]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: rtmw2d-*-build
          path: additions
          merge-multiple: true
      - run: python -m pip install huggingface_hub==0.36.0
      - name: Append new files without changing legacy models or catalog
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).upload_folder(
              repo_id='RabbitDaisuke/rtmw3d-webgpu-onnx', folder_path='additions',
              path_in_repo='rtmw2d', delete_patterns=None,
              commit_message='Append RTMW-L/X 256x192 precision matrix; preserve RTMW3D files')
          PY
