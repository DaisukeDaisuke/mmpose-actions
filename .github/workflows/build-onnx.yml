name: Build RTMW3D and RTMW L-X ONNX matrix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onnx.yml'
      - 'scripts/**'
      - 'experiments/rtmw2d.py'
      - 'patches/**'
      - 'tests/test_*.py'
      - 'tests/runtime-patch.test.mjs'
      - 'models.json'
      - 'requirements-build.txt'
      - 'package.json'
      - 'MODEL_CARD.md'
      - 'UPSTREAM_LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the experiment matrix to RabbitDaisuke/rtmw3d-webgpu-onnx'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: rtmw3d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    name: Reuse GitHub weights - ${{ matrix.model }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        model: [rtmw3d-l, rtmw3d-x]
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41313543454
          name: ${{ matrix.model }}-base
          path: base
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-base
          path: base/
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41313543454
          name: ${{ matrix.model }}-onnx
          path: release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-onnx
          path: release/
          retention-days: 7
  quantize:
    name: ${{ matrix.model }} / ${{ matrix.policy }}
    needs: export
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        model: [rtmw3d-l, rtmw3d-x]
        policy: [fp16-backbone, fp16-neck-head, int8-backbone, int8-neck, int8-head, int8-all]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 onnxconverter-common==1.14.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model }}-base
          path: base
      - run: python scripts/quantize_models.py --model '${{ matrix.model }}' --policy '${{ matrix.policy }}' --base base --output release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-${{ matrix.policy }}-onnx
          path: release/
          retention-days: 3
          if-no-files-found: error
  runtime:
    name: Patch ONNX Runtime Web 1.27.0
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify user patch and build matching runtime distribution
        run: |
          node --test tests/runtime-patch.test.mjs
          node scripts/build_runtime.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-onnx
          path: release/
          retention-days: 3
          if-no-files-found: error
  catalog:
    name: Validate complete model catalog
    needs: [export, quantize, runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-onnx'
          merge-multiple: true
      - run: python scripts/assemble_release.py release
      - uses: actions/upload-artifact@v4
        with:
          name: rtmw3d-webgpu-onnx-complete
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  rtmw2d-export:
    name: Cached export - ${{ matrix.model }} 256x192
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [rtmw-l, rtmw-x]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: base-cache
        with:
          path: base
          key: rtmw2d-base-${{ matrix.model }}-759b39c1-v1
      - uses: actions/github-script@v7
        if: steps.base-cache.outputs.cache-hit != 'true'
        id: source
        env:
          MODEL: ${{ matrix.model }}
        with:
          script: |
            const name = process.env.MODEL + '-256x192-base';
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const hit = artifacts.find(a => a.name === name && !a.expired && a.workflow_run?.id !== context.runId);
            core.setOutput('run', hit ? String(hit.workflow_run.id) : '');
            if (!hit) core.info('No reusable GitHub artifact; use official checkpoint with Actions cache.');
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ matrix.model }}-256x192-base
          path: base
      - id: state
        name: Check reusable base
        run: |
          if test -s base/simcc-fp32.onnx && test -s base/data.npz; then
            echo "export=false" >> "$GITHUB_OUTPUT"
          else
            echo "export=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v4
        if: steps.state.outputs.export == 'true'
        id: checkpoint-cache
        with:
          path: .cache/checkpoints
          key: rtmw2d-checkpoint-${{ matrix.model }}-official-v1
      - uses: actions/checkout@v4
        if: steps.state.outputs.export == 'true'
        with:
          repository: open-mmlab/mmpose
          ref: 759b39c13fea6ba094afc1fa932f51dc1b11cbf9
          path: upstream
      - uses: actions/setup-python@v5
        if: steps.state.outputs.export == 'true'
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install export dependencies
        if: steps.state.outputs.export == 'true'
        run: |
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' wheel
          python -m pip install 'torch==2.1.0+cpu' 'torchvision==0.16.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4'
          python -m pip install --no-build-isolation -r requirements-build.txt
          python -m pip install --only-binary=:all: 'mmcv==2.1.0' -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/index.html
          python -m pip install --no-deps --no-build-isolation -e ./upstream
      - name: Export from cached checkpoint (fetch official only on cache miss)
        if: steps.state.outputs.export == 'true'
        run: python experiments/rtmw2d.py export --model '${{ matrix.model }}'
      - uses: actions/cache/save@v4
        if: always() && steps.checkpoint-cache.outputs.cache-hit != 'true' && hashFiles('.cache/checkpoints/*.sha256') != ''
        with:
          path: .cache/checkpoints
          key: rtmw2d-checkpoint-${{ matrix.model }}-official-v1
      - uses: actions/cache/save@v4
        if: success() && steps.base-cache.outputs.cache-hit != 'true'
        with:
          path: base
          key: rtmw2d-base-${{ matrix.model }}-759b39c1-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-256x192-base
          path: base/
          retention-days: 7
  rtmw2d-quantize:
    name: ${{ matrix.model }} / ${{ matrix.policy }}
    needs: rtmw2d-export
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        model: [rtmw-l, rtmw-x]
        policy: [fp32, fp16-all, fp16-backbone, fp16-neck-head, int8-all, int8-backbone, int8-neck, int8-head]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 onnxconverter-common==1.14.0 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model }}-256x192-base
          path: base
      - run: python experiments/rtmw2d.py quantize --model '${{ matrix.model }}' --policy '${{ matrix.policy }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rtmw2d-${{ matrix.model }}-${{ matrix.policy }}-build
          path: release/
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Append RTMW 2D to existing Hugging Face repository
    needs: [catalog, rtmw2d-quantize]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: rtmw2d-*-build
          path: additions
          merge-multiple: true
      - run: python -m pip install huggingface_hub==0.36.0
      - name: Append new files without changing legacy models or catalog
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).upload_folder(
              repo_id='RabbitDaisuke/rtmw3d-webgpu-onnx', folder_path='additions',
              path_in_repo='rtmw2d', delete_patterns=None,
              commit_message='Append RTMW-L/X 256x192 precision matrix; preserve RTMW3D files')
          PY
