name: Build RTMW-L 256x192 for pseudo-3D PoC
on:
  push:
    branches: [main]
    paths: ['experiments/rtmw2d.py', '.github/workflows/rtmw2d.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: open-mmlab/mmpose
          ref: 759b39c13fea6ba094afc1fa932f51dc1b11cbf9
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install export dependencies
        run: |
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' wheel
          python -m pip install 'torch==2.1.0+cpu' 'torchvision==0.16.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4'
          python -m pip install --no-build-isolation -r requirements-build.txt
          python -m pip install --only-binary=:all: 'mmcv==2.1.0' -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1.0/index.html
          python -m pip install --no-deps --no-build-isolation -e ./upstream
      - name: Export full-body 133-joint RTMW-L 256x192
        run: python experiments/rtmw2d.py export
      - uses: actions/upload-artifact@v4
        with:
          name: rtmw-l-256x192-base
          path: base/
          retention-days: 7
  quantize:
    needs: export
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        policy: [fp32, fp16-all, fp16-backbone, fp16-neck-head, int8-all, int8-backbone, int8-neck, int8-head]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 onnxconverter-common==1.14.0 pillow==11.0.0
      - uses: actions/download-artifact@v4
        with:
          name: rtmw-l-256x192-base
          path: base
      - name: Build variant and measure body/ankle/foot drift
        run: python experiments/rtmw2d.py quantize --policy '${{ matrix.policy }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rtmw-l-256x192-${{ matrix.policy }}
          path: release/
          retention-days: 7
          if-no-files-found: error
