name: Convert SDPose WholeBody133 to ONNX
on:
  push:
    branches: [main]
    paths: ['sdpose/**', '.github/workflows/build-sdpose.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdpose-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    name: SDPose FP32 / ${{ matrix.component }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [vae, pose]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: checkpoint
        with:
          path: .cache/sdpose
          key: sdpose-0c8153e3-${{ matrix.component }}-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: sdpose/requirements.txt
      - name: Install export dependencies without a CUDA runtime
        run: |
          python -m pip install torch==2.8.0+cpu torchvision==0.23.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r sdpose/requirements.txt
      - name: Export trained weights at the original resolution
        run: python sdpose/export.py export --component '${{ matrix.component }}' --output 'release/fp32/${{ matrix.component }}'
      - uses: actions/cache/save@v4
        if: always() && steps.checkpoint.outputs.cache-hit != 'true' && hashFiles('.cache/sdpose/**/snapshots/**/config.json') != ''
        with:
          path: .cache/sdpose
          key: sdpose-0c8153e3-${{ matrix.component }}-v1
      - uses: actions/upload-artifact@v4
        with:
          name: sdpose-base-${{ matrix.component }}
          path: release/fp32/${{ matrix.component }}/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  variants:
    name: SDPose ${{ matrix.component }} / ${{ matrix.policy }}
    needs: export
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {component: vae, policy: fp16}
          - {component: vae, policy: int8-weight-all}
          - {component: pose, policy: fp16}
          - {component: pose, policy: int8-weight-all}
          - {component: pose, policy: int8-weight-unet}
          - {component: pose, policy: int8-weight-head}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 onnx==1.18.0 onnxconverter-common==1.16.0
      - uses: actions/download-artifact@v4
        with:
          name: sdpose-base-${{ matrix.component }}
          path: base
      - name: Convert selected weights; preserve all 133 heatmaps
        run: python sdpose/export.py quantize --component '${{ matrix.component }}' --policy '${{ matrix.policy }}' --source base --output 'release/${{ matrix.policy }}/${{ matrix.component }}'
      - uses: actions/upload-artifact@v4
        with:
          name: sdpose-variant-${{ matrix.policy }}-${{ matrix.component }}
          path: release/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish:
    name: Publish to RabbitDaisuke/SDPose-Wholebody-onnx
    needs: variants
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Make room for the large external ONNX tensors
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: sdpose-base-vae
          path: release/fp32/vae
      - uses: actions/download-artifact@v4
        with:
          name: sdpose-base-pose
          path: release/fp32/pose
      - uses: actions/download-artifact@v4
        with:
          pattern: sdpose-variant-*
          path: release
          merge-multiple: true
      - run: python -m pip install huggingface_hub==0.36.0
      - name: Verify file hashes and upload ONNX components and metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: RabbitDaisuke/SDPose-Wholebody-onnx
        run: python sdpose/publish.py
