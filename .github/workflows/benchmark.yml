name: Validate and publish browser benchmark
on:
  push:
    branches: [main]
    paths: ['benchmark/**', 'tests/benchmark.test.mjs', 'tests/mediapipe-assets.mjs', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['benchmark/**', 'tests/benchmark.test.mjs', 'tests/mediapipe-assets.mjs', '.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser syntax and GPU buffer/readback contracts
        run: |
          node --check benchmark/benchmark.js
          node --check benchmark/execution.js
          node --check benchmark/mediapipe.js
          node --check benchmark/mediapipe-adapter.js
          node --test tests/benchmark.test.mjs
          node tests/mediapipe-assets.mjs
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: '3.10'
      - name: Publish benchmark assets without rebuilding models
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/rtmw-pycache" python -m py_compile benchmark/native_benchmark.py
          python -m pip install huggingface_hub==0.36.0
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(repo_id='RabbitDaisuke/rtmw3d-webgpu-onnx', repo_type='model',
              folder_path='benchmark', path_in_repo='benchmark',
              commit_message='Update browser execution-path benchmark ' + os.environ['GITHUB_SHA'])
          PY
